services:
  clipper:
    build: .
    container_name: madson-cobra-clipper
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      CAPACITY: "3"
    volumes:
      - media:/app/media
      - data:/app/data
    restart: unless-stopped

volumes:
  media:
  data:
